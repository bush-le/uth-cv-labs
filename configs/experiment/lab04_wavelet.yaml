# Configuration for Lab 04: Image Similarity Comparison using Wavelet Transform & Perceptual Hashing
lab_id: "lab04"
experiment_name: "wavelet_image_hashing"
seed: 42

output_dirs:
  predictions: "experiments/predictions/lab04"
  logs: "experiments/logs/lab04"
  samples: "data/samples/lab04"

default_params:
  color_space: "RGB"
  channel_order: ["R", "G", "B"]
  wavelet: "db4"
  level: 1
  bits: 8
  quantize_mode: "median"
  image_size: [256, 256]

wavelet_families:
  - "haar"
  - "db2"
  - "db4"
  - "sym4"
  - "coif2"

comparison_algorithms:
  - "wHash"
  - "aHash"
  - "dHash"
  - "pHash"

robustness_suite:
  photometric:
    brightness_factors: [0.7, 1.3]
    contrast_factors: [0.6, 1.4]
    gaussian_blur_sigmas: [1.0, 2.0]
    jpeg_qualities: [10, 30, 50, 80]
    noise_sigmas: [15, 30]
    salt_pepper_ratios: [0.03]
  geometric:
    scale_factors: [0.5, 1.5]
    crop_ratios: [0.8, 0.9]
    rotation_angles: [-10, -5, -2, 2, 5, 10, 45, 90]
    flip_horizontal: true

evaluation:
  num_sample_categories: 6
  images_per_category: 4
  similarity_threshold: 12

# Notebook uses these manifests and selects its threshold on calibration only.
notebook:
  dataset_dir: data/processed/lab04_pairs
  top_k: 3
  retrieval_source_index: 0
  retrieval_transform: jpeg
  detail_source_index: 0
  detail_level: 1
  quantized_level: 3
  quantized_step: 2.0
  comparison_wavelet: haar
  comparison_level: 2
  geometric_checks:
    - ["crop 80%", crop, 0.8]
    - ["rotate 5°", rotate, 5]
    - [flip, flip, true]
