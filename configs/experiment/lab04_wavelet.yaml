# Hash parameters and notebook experiments. Dataset settings: configs/dataset/lab04_pairs.yaml.
default_params:
  wavelet: "db4"
  level: 1
  bits: 8
  quantize_mode: "median"
  image_size: [256, 256]

# Notebook uses these manifests and selects its threshold on calibration only.
notebook:
  dataset_dir: data/processed/lab04_pairs
  top_k: 3
  retrieval_source_index: 0
  retrieval_transform: jpeg
  detail_source_index: 0
  quantized_level: 3
  quantized_step: 2.0
  comparison_wavelet: haar
  comparison_level: 2
  geometric_checks:
    - ["crop 80%", crop, 0.8]
    - ["rotate 5°", rotate, 5]
    - [flip, flip, true]
