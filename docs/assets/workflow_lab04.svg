  <!-- 3. WAVELET 5-STAGE CORE (CENTER COLUMN) -->
  <g id="stages-layer">
    <rect x="340" y="175" width="480" height="540" rx="10" fill="#fdfaff" stroke="#8b5cf6" stroke-width="1.8" />
    <path d="M 340 185 Q 340 175 350 175 L 810 175 Q 820 175 820 185 L 820 207 L 340 207 Z" fill="#f5f3ff" />
    <text x="354" y="196" font-size="11.5" font-weight="700" fill="#6d28d9">3. THUẬT TOÁN WAVELET HASH 192-BIT RGB</text>
    <rect x="736" y="182" width="72" height="18" rx="9" fill="#8b5cf6" />
    <text x="772.0" y="194" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">5 STAGES</text>

    <!-- Stage 1 -->
    <g id="W1" filter="url(#shadow)">
      <rect x="355" y="218" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="224" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="235" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 1</text>
      <text x="367" y="239" font-size="11.5" font-weight="700" fill="#0f172a">1. Phân Tách 3 Kênh Màu Độc Lập</text>
      <text x="367" y="254" font-size="9.5" fill="#475569">Tách ảnh đầu vào thành 3 ma trận riêng biệt Red, Green, Blue</text>
      <text x="367" y="268" font-size="9.5" fill="#475569">Bảo toàn sắc thái màu sắc (khắc phục nhược điểm wHash xám đơn kênh)</text>
    </g>

    <!-- Stage 2 -->
    <g id="W2" filter="url(#shadow)">
      <rect x="355" y="308" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="314" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="325" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 2</text>
      <text x="367" y="329" font-size="11.5" font-weight="700" fill="#0f172a">2. Phân Rã 2D Haar Wavelet (DWT 1-Level)</text>
      <text x="367" y="344" font-size="9.5" fill="#475569">Phân giải đa độ phân giải (MRA) thành 4 dải tần: LL, LH, HL, HH</text>
      <text x="367" y="358" font-size="9.5" fill="#475569">Dải LL tập trung &gt;90% năng lượng cấu trúc không gian của bức ảnh</text>
    </g>

    <!-- Stage 3 -->
    <g id="W3" filter="url(#shadow)">
      <rect x="355" y="398" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="404" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="415" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 3</text>
      <text x="367" y="419" font-size="11.5" font-weight="700" fill="#0f172a">3. Trích Xuất &amp; Co Cụm Dải LL về 8x8</text>
      <text x="367" y="434" font-size="9.5" fill="#475569">Thu nhỏ dải xấp xỉ LL1 về ma trận kích thước chuẩn 8x8 (64 hệ số)</text>
      <text x="367" y="448" font-size="9.5" fill="#475569">Loại bỏ chi tiết tần số cao gây nhiễu, tăng độ bền trước biến dạng nén</text>
    </g>

    <!-- Stage 4 -->
    <g id="W4" filter="url(#shadow)">
      <rect x="355" y="488" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="494" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="505" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 4</text>
      <text x="367" y="509" font-size="11.5" font-weight="700" fill="#0f172a">4. Lượng Tử Hóa Trung Vị (Median Binarize)</text>
      <text x="367" y="524" font-size="9.5" fill="#475569">So sánh từng hệ số với median(LL) -&gt; 1 nếu &gt;= median, ngược lại 0</text>
      <text x="367" y="538" font-size="9.5" fill="#475569">Đảm bảo cân bằng 32 bit 0 và 32 bit 1 (Entropy cực đại = 1.0)</text>
    </g>

    <!-- Stage 5 -->
    <g id="W5" filter="url(#shadow)">
      <rect x="355" y="578" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="584" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="595" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 5</text>
      <text x="367" y="599" font-size="11.5" font-weight="700" fill="#0f172a">5. Ghép Vector Nhị Phân 192-Bit wHash RGB</text>
      <text x="367" y="614" font-size="9.5" fill="#475569">Ghép nối 3 chuỗi 64-bit: Hash = R64 || G64 || B64</text>
      <text x="367" y="628" font-size="9.5" fill="#475569">Biểu diễn toàn vẹn thông tin hình học, vi cấu trúc và phân bố màu sắc</text>
    </g>
  </g>

