  <!-- 3. CANNY 5-STAGE CORE (CENTER COLUMN) -->
  <g id="stages-layer">
    <rect x="340" y="175" width="480" height="540" rx="10" fill="#fdfaff" stroke="#8b5cf6" stroke-width="1.8" />
    <path d="M 340 185 Q 340 175 350 175 L 810 175 Q 820 175 820 185 L 820 207 L 340 207 Z" fill="#f5f3ff" />
    <text x="354" y="196" font-size="11.5" font-weight="700" fill="#6d28d9">3. THUẬT TOÁN CANNY 5 GIAI ĐOẠN TOÁN HỌC</text>
    <rect x="736" y="182" width="72" height="18" rx="9" fill="#8b5cf6" />
    <text x="772.0" y="194" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">5 STAGES</text>

    <!-- Stage 1 -->
    <g id="C1" filter="url(#shadow)">
      <rect x="355" y="218" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="224" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="235" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 1</text>
      <text x="367" y="239" font-size="11.5" font-weight="700" fill="#0f172a">1. Khử Nhiễu Gaussian Smoothing</text>
      <text x="367" y="254" font-size="9.5" fill="#475569">Kernel 5x5, sigma=1.4 triệt tiêu thành phần nhiễu tần số cao</text>
      <text x="367" y="268" font-size="9.5" fill="#475569">Bảo toàn năng lượng dải tần và định hướng gradient chuẩn xác</text>
    </g>

    <!-- Stage 2 -->
    <g id="C2" filter="url(#shadow)">
      <rect x="355" y="308" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="314" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="325" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 2</text>
      <text x="367" y="329" font-size="11.5" font-weight="700" fill="#0f172a">2. Tính Gradient Biên Độ &amp; Hướng Góc</text>
      <text x="367" y="344" font-size="9.5" fill="#475569">Toán tử Sobel 3x3 tính Gx, Gy • G = sqrt(Gx^2 + Gy^2)</text>
      <text x="367" y="358" font-size="9.5" fill="#475569">Hướng gradient theta = arctan(Gy / Gx) trực giao với đường biên</text>
    </g>

    <!-- Stage 3 -->
    <g id="C3" filter="url(#shadow)">
      <rect x="355" y="398" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="404" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="415" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 3</text>
      <text x="367" y="419" font-size="11.5" font-weight="700" fill="#0f172a">3. Triệt Tiêu Không Cực Đại (NMS)</text>
      <text x="367" y="434" font-size="9.5" fill="#475569">Lượng tử hóa theta thành 4 hướng chính (0°, 45°, 90°, 135°)</text>
      <text x="367" y="448" font-size="9.5" fill="#475569">So sánh pixel với 2 lân cận theo gradient -> Gọt mỏng biên 1-pixel</text>
    </g>

    <!-- Stage 4 -->
    <g id="C4" filter="url(#shadow)">
      <rect x="355" y="488" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="494" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="505" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 4</text>
      <text x="367" y="509" font-size="11.5" font-weight="700" fill="#0f172a">4. Phân Ngưỡng Kép (Double Thresholding)</text>
      <text x="367" y="524" font-size="9.5" fill="#475569">Thigh = 150 (Biên mạnh) • Tlow = 50 (Biên yếu) • Tỷ lệ chuẩn 3:1</text>
      <text x="367" y="538" font-size="9.5" fill="#475569">Phân tách thành 3 miền tin cậy: Strong (255), Weak (128), Zero (0)</text>
    </g>

    <!-- Stage 5 -->
    <g id="C5" filter="url(#shadow)">
      <rect x="355" y="578" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="584" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="595" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 5</text>
      <text x="367" y="599" font-size="11.5" font-weight="700" fill="#0f172a">5. Lần Vết Theo Vết Trễ (Hysteresis Tracking)</text>
      <text x="367" y="614" font-size="9.5" fill="#475569">Liên thông 8-lân cận kết nối các pixel yếu có tiếp xúc với pixel mạnh</text>
      <text x="367" y="628" font-size="9.5" fill="#475569">Loại bỏ triệt để các đốm biên rời rạc do nhiễu sinh ra</text>
    </g>
  </g>

