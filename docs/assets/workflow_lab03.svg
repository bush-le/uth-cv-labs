    </g>

    <g id="D4" filter="url(#shadow)">
      <rect x="860" y="488" width="300" height="54" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6" />
      <text x="872" y="508" font-size="11" font-weight="700" fill="#0f172a">Phân Đoạn Hình Thái Học Đồng Xu</text>
      <text x="872" y="523" font-size="9.5" fill="#475569">yc4_regions.png • Closing + floodFill</text>
      <text x="872" y="536" font-size="9" fill="#15803d">Biến viền biên thành mặt nạ đặc khối (Blobs)</text>
    </g>

    <g id="D5" filter="url(#shadow)">
