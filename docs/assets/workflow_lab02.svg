    <text x="772.0" y="194" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">5 STAGES</text>

    <!-- Stage 1: Point Ops -->
    <g id="S1_P" filter="url(#shadow)">
      <rect x="355" y="218" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="224" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="235" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 1</text>
      <text x="367" y="239" font-size="11.5" font-weight="700" fill="#0f172a">Toán Tử Điểm Ảnh &amp; Chống Tràn uint8</text>
      <text x="367" y="254" font-size="9.5" fill="#475569">Tăng/Giảm sáng (beta=±50) • Tương phản (alpha=0.5, 1.8) • Đảo âm bản</text>
      <text x="367" y="268" font-size="9.5" fill="#475569">Biến đổi Gamma phi tuyến (gamma=0.5, 2.2) có np.clip(0, 255)</text>
    </g>

    <!-- Stage 2: Linear Filters -->
    <g id="S2_L" filter="url(#shadow)">
      <rect x="355" y="308" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="314" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="325" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 2</text>
      <text x="367" y="329" font-size="11.5" font-weight="700" fill="#0f172a">Lọc Tuyến Tính &amp; Kernel Làm Nét Trọng Số</text>
      <text x="367" y="344" font-size="9.5" fill="#475569">Làm mờ Mean (7x7, 21x21) • Gauss (sigma=3, 7 với k=6*sigma+1)</text>
      <text x="367" y="358" font-size="9.5" fill="#475569">Kernel làm nét 8-lân cận có trọng số (Center=9, Sum=1.0 bảo toàn sáng)</text>
    </g>

    <!-- Stage 3: Edge Detection -->
    <g id="S3_E" filter="url(#shadow)">
      <rect x="355" y="398" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="404" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="415" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 3</text>
      <text x="367" y="419" font-size="11.5" font-weight="700" fill="#0f172a">Đạo Hàm Bậc Nhất: Sobel vs Prewitt</text>
      <text x="367" y="434" font-size="9.5" fill="#475569">Tính đạo hàm Gx, Gy • Biên độ Gradient G = sqrt(Gx^2 + Gy^2)</text>
      <text x="367" y="448" font-size="9.5" fill="#475569">Kiểm chứng thực nghiệm tương quan Pearson r = 0.9961 cực cao</text>
    </g>

    <!-- Stage 4: Sum Rule -->
    <g id="S4_R" filter="url(#shadow)">
      <rect x="355" y="488" width="450" height="54" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
      <rect x="743" y="494" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="505" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 4</text>
      <text x="367" y="509" font-size="11.5" font-weight="700" fill="#0f172a">Kiểm Chứng Quy Luật Tổng Hệ Số Kernel</text>
      <text x="367" y="524" font-size="9.5" fill="#475569">Sigma=0 (Phát hiện biên) • Sigma=0.5 (Tối ảnh) • Sigma=1 (Bảo toàn)</text>
      <text x="367" y="538" font-size="9.5" fill="#475569">Sigma=2.0 (Cháy sáng) • Phân tích tương tác quang học toán học</text>
    </g>

    <!-- Stage 5: Nonlinear -->
    <g id="S5_N" filter="url(#shadow)">
