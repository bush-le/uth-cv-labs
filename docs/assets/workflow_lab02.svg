      <rect x="743" y="584" width="54" height="15" rx="7.5" fill="#7c3aed" />
      <text x="770.0" y="595" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">STAGE 5</text>
      <text x="367" y="599" font-size="11.5" font-weight="700" fill="#0f172a">Lọc Phi Tuyến: Khử Nhiễu Muối Tiêu (3%)</text>
      <text x="367" y="614" font-size="9.5" fill="#475569">Median Filter triệt tiêu 100% xung nhiễu cực trị không làm nhòe cạnh</text>
      <text x="367" y="628" font-size="9.5" fill="#475569">Bilateral Filter kết hợp miền không gian &amp; miền cường độ giữ cạnh</text>
    </g>
