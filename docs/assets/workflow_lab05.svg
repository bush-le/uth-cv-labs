<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="100%" height="auto" style="max-width: 1140px; display: block; margin: 16px auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803d" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1140" height="640" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g id="header">
    <rect x="0" y="0" width="1140" height="52" rx="12" fill="#183f35" />
    <rect x="0" y="40" width="1140" height="12" fill="#183f35" />
    <text x="25" y="33" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">LAB 05: REAL-TIME FACE RECOGNITION ARCHITECTURE (MTCNN &amp; FACENET)</text>
    <rect x="910" y="13" width="205" height="26" rx="13" fill="#2a7950" />
    <text x="1012.5" y="30" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">COSINE &gt; 0.7 • CLEAN ARCHITECTURE</text>
  </g>

  <!-- SECTION 1: OFFLINE REGISTRATION PIPELINE -->
  <g id="offline_section" filter="url(#card-shadow)">
    <rect x="25" y="70" width="1090" height="235" rx="10" fill="#ffffff" stroke="#2a7950" stroke-width="1.6" />
    <path d="M 25 80 Q 25 70 35 70 L 1105 70 Q 1115 70 1115 80 L 1115 96 L 25 96 Z" fill="#e7efe5" />
    <text x="40" y="88" font-size="12" font-weight="700" fill="#183f35">1. TIẾN TRÌNH ĐĂNG KÝ NGOẠI TUYẾN (OFFLINE REGISTRATION PIPELINE)</text>
    <rect x="980" y="74" width="125" height="18" rx="9" fill="#2a7950" />
    <text x="1042.5" y="86" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">DATABASE ENROLL</text>

    <!-- Card 1.1: Image Ingestion -->
    <rect x="45" y="110" width="240" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="58" y="132" font-size="12" font-weight="700" fill="#0f172a">Thu Thập Khuôn Mặt Mẫu</text>
    <text x="58" y="152" font-size="10" fill="#475569">• Quét thư mục data/raw/lab05/faces/</text>
    <text x="58" y="168" font-size="10" fill="#475569">• Hoặc chụp N frame qua Webcam (S)</text>
    <text x="58" y="184" font-size="10" fill="#475569">• Kiểm tra khung hình rỗng / lỗi đọc</text>
    <text x="58" y="200" font-size="10" fill="#15803d">• Từ chối ảnh có 0 hoặc &gt;1 khuôn mặt</text>
    <rect x="58" y="222" width="214" height="26" rx="4" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="165" y="239" font-size="9.5" font-weight="600" fill="#065f46" text-anchor="middle">FaceRegistrationPipeline</text>

    <!-- Arrow 1.1 -> 1.2 -->
    <path d="M 285 197 L 315 197" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

    <!-- Card 1.2: MTCNN Face Detection -->
    <rect x="315" y="110" width="240" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="328" y="132" font-size="12" font-weight="700" fill="#0f172a">Phát Hiện &amp; Căn Chỉnh MTCNN</text>
    <text x="328" y="152" font-size="10" fill="#475569">• P-Net: Tạo vùng ứng viên sơ bộ</text>
    <text x="328" y="168" font-size="10" fill="#475569">• R-Net: Lọc nhiễu &amp; tinh chỉnh BBox</text>
    <text x="328" y="184" font-size="10" fill="#475569">• O-Net: 5 landmarks (mắt, mũi, môi)</text>
    <text x="328" y="200" font-size="10" fill="#15803d">• validate_and_clip_bbox kẹp biên</text>
    <rect x="328" y="222" width="214" height="26" rx="4" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="435" y="239" font-size="9.5" font-weight="600" fill="#065f46" text-anchor="middle">MTCNNDetector (Conf &gt;= 0.90)</text>

    <!-- Arrow 1.2 -> 1.3 -->
    <path d="M 555 197 L 585 197" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

    <!-- Card 1.3: FaceNet InceptionResnetV1 -->
    <rect x="585" y="110" width="240" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="598" y="132" font-size="12" font-weight="700" fill="#0f172a">Trích Xuất FaceNet 512-D</text>
    <text x="598" y="152" font-size="10" fill="#475569">• BGR -&gt; RGB, Resize 160x160</text>
    <text x="598" y="168" font-size="10" fill="#475569">• Chuẩn hóa (x - 127.5) / 128.0</text>
    <text x="598" y="184" font-size="10" fill="#475569">• InceptionResnetV1 (Pretrained)</text>
    <text x="598" y="200" font-size="10" fill="#15803d">• Vector đơn vị: ||f(x)||_2 = 1.0</text>
    <rect x="598" y="222" width="214" height="26" rx="4" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="705" y="239" font-size="9.5" font-weight="600" fill="#065f46" text-anchor="middle">FaceNetExtractor (512 chiều)</text>

    <!-- Arrow 1.3 -> 1.4 -->
    <path d="M 825 197 L 855 197" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

    <!-- Card 1.4: FaceDatabase (.npz) -->
    <rect x="855" y="110" width="240" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="868" y="132" font-size="12" font-weight="700" fill="#0f172a">Cơ Sở Dữ Liệu (.npz)</text>
    <text x="868" y="152" font-size="10" fill="#475569">• Quản trị danh sách tên danh tính</text>
    <text x="868" y="168" font-size="10" fill="#475569">• Gom cụm vector trung bình (Centroid)</text>
    <text x="868" y="184" font-size="10" fill="#475569">• Chuẩn hóa L2 lại trên centroid</text>
    <text x="868" y="200" font-size="10" fill="#15803d">• Lưu / Nạp nhanh với NumPy .npz</text>
    <rect x="868" y="222" width="214" height="26" rx="4" fill="#f0fdf4" stroke="#86efac" />
    <text x="975" y="239" font-size="9.5" font-weight="600" fill="#15803d" text-anchor="middle">FaceDatabase (Lưu Trữ Bền Vững)</text>
  </g>

  <!-- CONNECTOR OFFLINE DB -> ONLINE MATCHER -->
  <path d="M 975 305 L 975 365 L 705 365 L 705 390" stroke="#2a7950" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-green)" />

  <!-- SECTION 2: ONLINE RECOGNITION PIPELINE -->
  <g id="online_section" filter="url(#card-shadow)">
    <rect x="25" y="325" width="1090" height="295" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
    <path d="M 25 335 Q 25 325 35 325 L 1105 325 Q 1115 325 1115 335 L 1115 351 L 25 351 Z" fill="#e0f2fe" />
    <text x="40" y="343" font-size="12" font-weight="700" fill="#0369a1">2. TIẾN TRÌNH NHẬN DIỆN THỜI GIAN THỰC (REAL-TIME RECOGNITION PIPELINE)</text>
    <rect x="970" y="329" width="135" height="18" rx="9" fill="#0284c7" />
    <text x="1037.5" y="341" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">REAL-TIME INFERENCE</text>

    <!-- Sub-card 2.1: Webcam Stream -->
    <rect x="45" y="365" width="240" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="58" y="387" font-size="12" font-weight="700" fill="#0f172a">Webcam / Video Stream</text>
    <text x="58" y="407" font-size="10" fill="#475569">• WebcamManager bọc cv2.VideoCapture</text>
    <text x="58" y="423" font-size="10" fill="#475569">• Tự động giải phóng qua Context Manager</text>
    <text x="58" y="439" font-size="10" fill="#475569">• Fallback Batch Mode nếu không có cam</text>
    <text x="58" y="455" font-size="10" fill="#0284c7">• Hỗ trợ phím tắt [Q] Quit, [S] Save</text>
    <rect x="58" y="475" width="214" height="26" rx="4" fill="#f0f9ff" stroke="#bae6fd" />
    <text x="165" y="492" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">WebcamManager (Safe Resource)</text>

    <!-- Arrow 2.1 -> 2.2 -->
    <path d="M 285 440 L 315 440" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

    <!-- Sub-card 2.2: Detection & Crop -->
    <rect x="315" y="365" width="240" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="328" y="387" font-size="12" font-weight="700" fill="#0f172a">Dò Mặt &amp; Tiền Xử Lý</text>
    <text x="328" y="407" font-size="10" fill="#475569">• MTCNN detect_faces đa khuôn mặt</text>
    <text x="328" y="423" font-size="10" fill="#475569">• Kẹp biên BBox: [0, 0, W, H]</text>
    <text x="328" y="439" font-size="10" fill="#475569">• Crop vùng mặt, Resize 160x160</text>
    <text x="328" y="455" font-size="10" fill="#0284c7">• Batch Whitening đưa về [-1.0, 1.0]</text>
    <rect x="328" y="475" width="214" height="26" rx="4" fill="#f0f9ff" stroke="#bae6fd" />
    <text x="435" y="492" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">preprocess_face (Tensor)</text>

    <!-- Arrow 2.2 -> 2.3 -->
    <path d="M 555 440 L 585 440" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

    <!-- Sub-card 2.3: Extraction & Matcher -->
    <rect x="585" y="365" width="240" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="598" y="387" font-size="12" font-weight="700" fill="#0f172a">Cosine Similarity Matcher</text>
    <text x="598" y="407" font-size="10" fill="#475569">• FaceNet trích xuất vector truy vấn</text>
    <text x="598" y="423" font-size="10" fill="#475569">• Dot Product với toàn bộ DB: u · v</text>
    <text x="598" y="439" font-size="10" fill="#475569">• Xác định ArgMax danh tính gần nhất</text>
    <text x="598" y="455" font-size="10" fill="#0284c7">• Phân ngưỡng khắt khe: sim &gt; 0.70</text>
    <rect x="598" y="475" width="214" height="26" rx="4" fill="#f0f9ff" stroke="#bae6fd" />
    <text x="705" y="492" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">SimilarityMatcher (Threshold 0.7)</text>

    <!-- Arrow 2.3 -> 2.4 -->
    <path d="M 825 440 L 855 440" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

    <!-- Sub-card 2.4: OSD Display -->
    <rect x="855" y="365" width="240" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="868" y="387" font-size="12" font-weight="700" fill="#0f172a">Hiển Thị OSD Trực Quan</text>
    <text x="868" y="407" font-size="10" fill="#15803d">• Matched: BBox xanh lá (sim &gt; 0.70)</text>
    <text x="868" y="423" font-size="10" fill="#dc2626">• Unknown: BBox màu đỏ (sim &lt;= 0.70)</text>
    <text x="868" y="439" font-size="10" fill="#475569">• HUD Bar: FPS, Faces, DB Size, Ngưỡng</text>
    <text x="868" y="455" font-size="10" fill="#0284c7">• Đo FPS bằng Moving Average</text>
    <rect x="868" y="475" width="214" height="26" rx="4" fill="#f0f9ff" stroke="#bae6fd" />
    <text x="975" y="492" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">FaceVisualizer.draw_results</text>

    <!-- Bottom summary row -->
    <rect x="45" y="530" width="1050" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="65" y="552" font-size="11" font-weight="700" fill="#0f172a">Định Lý Toán Học &amp; Bảo Đảm Kỹ Thuật (Mathematical &amp; Verification Guarantee):</text>
    <text x="65" y="570" font-size="10" fill="#475569">1. Khoảng cách Euclidean &amp; Cosine: d_E^2 = 2(1 - cos θ) &lt; 0.60 &lt;=&gt; similarity &gt; 0.70 &lt;=&gt; θ &lt; 45.57°.</text>
    <text x="65" y="586" font-size="10" fill="#475569">2. Tốc độ thực nghiệm: 32+ FPS (NVIDIA CUDA GPU), 12-15 FPS (CPU x86_64). Bộ kiểm thử unit tests vượt qua 100%.</text>
  </g>
</svg>
